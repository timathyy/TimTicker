name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            .config/dotnet-tools.json
            **/*.csproj

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TimTicker.slnx --disable-parallel

      - name: Verify formatting
        run: dotnet format TimTicker.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build TimTicker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TimTicker.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
